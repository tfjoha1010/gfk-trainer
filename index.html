<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GFK: Gefühle & Bedürfnisse unterscheiden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #EEF0F2; --surface: #FFFFFF; --ink: #1B2230; --muted: #5A6474; --line: #D5DAE0;
  --on-strong: #FFFFFF;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15191F; --surface: #1E232B; --ink: #E7EAEE; --muted: #9AA3AF; --line: #2E3540; --on-strong: #15191F;
  }
  :root:not([data-theme="light"]) .group, :root:not([data-theme="light"]) .group-dot, :root:not([data-theme="light"]) .trainer { --a: var(--accent-d); }
}
:root[data-theme="dark"] {
  --bg: #15191F; --surface: #1E232B; --ink: #E7EAEE; --muted: #9AA3AF; --line: #2E3540; --on-strong: #15191F;
}
:root[data-theme="dark"] .group, :root[data-theme="dark"] .group-dot, :root[data-theme="dark"] .trainer { --a: var(--accent-d); }
.group, .group-dot { --a: var(--accent); }
html { scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 120px); }
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: 17px; line-height: 1.5;
}
.wrap { max-width: 760px; margin: 0 auto; padding: 0 18px 64px; }
h1, h2, h3 { font-family: "Bricolage Grotesque", system-ui, sans-serif; letter-spacing: -0.01em; }
h1 { font-size: clamp(30px, 7vw, 46px); line-height: 1.05; margin: 28px 0 10px; font-weight: 700; }
.lead { color: var(--muted); margin: 0 0 22px; max-width: 62ch; }

.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); padding: 10px 0 8px; margin: 0 -18px; padding-left: 18px; padding-right: 18px;
  border-bottom: 1px solid var(--line);
}
.search {
  width: 100%; font: inherit; padding: 11px 14px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
}
.search:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; }
.nav { display: flex; gap: 6px; overflow-x: auto; padding: 10px 0 2px; scrollbar-width: none; }
.nav::-webkit-scrollbar { display: none; }
.nav button {
  flex: none; font: inherit; font-size: 14px; border: 1px solid var(--line); background: var(--surface);
  color: var(--ink); border-radius: 999px; padding: 5px 12px 5px 9px; cursor: pointer; display: flex; align-items: center; gap: 7px;
}
.nav .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--a); }

.keys { display: grid; gap: 12px; grid-template-columns: 1fr; margin: 22px 0 8px; }
@media (min-width: 640px) { .keys { grid-template-columns: 1fr 1fr; } }
.key { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; }
.key h3 { margin: 0 0 6px; font-size: 19px; }
.key p { margin: 0 0 10px; color: var(--muted); font-size: 15.5px; }
.pairs { display: flex; flex-direction: column; gap: 6px; }
.pair { display: flex; align-items: center; gap: 8px; font-size: 15.5px; flex-wrap: wrap; }
.pair .arrow { color: var(--muted); }
.linkish {
  font: inherit; background: none; border: 0; padding: 0; color: var(--ink); cursor: pointer;
  text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; text-decoration-thickness: 2px;
}
.linkish:hover, .linkish:focus-visible { text-decoration-color: var(--ink); outline: none; }
.rule { font-size: 15.5px; margin: 0 0 6px; }
.rule b { font-weight: 700; }

.group { margin-top: 40px; }
.ghead { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; border-top: 4px solid var(--a); padding-top: 12px; }
.ghead h3 { margin: 0; font-size: 27px; font-weight: 700; }
.bereich { font-size: clamp(30px, 6vw, 38px); margin: 64px 0 -12px; font-weight: 700; color: var(--muted); }
.ghead .sub { color: var(--muted); font-size: 15.5px; }

.ramp { margin: 16px 0 6px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip {
  font: inherit; font-size: 15px; border: 0; border-radius: 8px; padding: 6px 11px; cursor: pointer;
  background: color-mix(in oklab, var(--a) var(--p), var(--surface));
  color: var(--ink);
}
.chip.strong { color: var(--on-strong); }
.chip.plain { background: var(--surface); border: 1px solid var(--line); }
.chip.folge { background: transparent; border: 1.5px dashed var(--a); }
.chip:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.chip.on { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--a); }
.sep { color: var(--muted); font-size: 13.5px; padding: 0 4px; }
.axis { display: flex; justify-content: space-between; color: var(--muted); font-size: 13.5px; margin-bottom: 8px; }
.axis .line { flex: 1; height: 2px; margin: 0 10px; align-self: center;
  background: linear-gradient(90deg, color-mix(in oklab, var(--a) 15%, var(--surface)), var(--a)); border-radius: 2px; }
.note { color: var(--muted); font-size: 14.5px; margin: 4px 0 0; }

.schwellen { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 10px; }
.schwellen summary { cursor: pointer; font-size: 14.5px; color: var(--ink); list-style: none; }
.schwellen summary::-webkit-details-marker { display: none; }
.schwellen summary::before { content: "▸ "; color: var(--a); }
.schwellen[open] summary::before { content: "▾ "; }
.schwellen summary .cnt { color: var(--muted); font-size: 13px; }
.schwelle { margin: 12px 0 0; padding-left: 12px; border-left: 2px solid color-mix(in oklab, var(--a) 35%, var(--surface)); }
.sq { margin: 0; font-size: 15.5px; }
.arttag { margin-left: 8px; font-size: 11.5px; border: 1px solid var(--line); border-radius: 99px; padding: 1px 7px; color: var(--muted); }
.sa { margin: 6px 0 0; font-size: 14.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.sa b { color: var(--ink); font-weight: 400; }
.sa .wchip { font-size: 14px; padding: 3px 9px; }
.sa .slash { padding: 0 6px; }
.list { list-style: none; margin: 14px 0 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.item {
  padding: 12px 14px 12px 16px; border-left: 3px solid transparent; border-radius: 0 10px 10px 0;
  transition: background .25s, border-color .25s;
}
.item.on { background: color-mix(in oklab, var(--a) 12%, var(--surface)); border-left-color: var(--a); }
.item .w { font-weight: 700; font-size: 18px; display: flex; align-items: center; gap: 10px; }
.mark { width: 15px; height: 15px; border-radius: 5px; flex: none;
  background: color-mix(in oklab, var(--a) var(--p, 0%), var(--surface));
  box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--a) 30%, transparent); }
.mark.folge { background: transparent; box-shadow: none; border: 1.5px dashed var(--a); }
.nebentag { font-size: 11.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
  color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px; }
.item .d { margin: 2px 0 0; max-width: 64ch; }
.item .vs { margin-top: 6px; font-size: 14.5px; color: var(--muted); }
.item .vs .linkish { color: var(--ink); }

.empty { margin-top: 40px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
.empty p { margin: 0 0 10px; }
.btn { font: inherit; font-size: 15px; padding: 8px 14px; border-radius: 10px; border: 1px solid var(--ink); background: var(--ink); color: var(--bg); cursor: pointer; }

.seg { display: flex; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 3px; margin-bottom: 8px; }
.seg { flex-wrap: wrap; }
.seg button { flex: 1 1 30%; font: inherit; font-size: 13px; line-height: 1.2; border: 0; background: transparent; color: var(--muted); padding: 8px 10px; border-radius: 9px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); font-weight: 700; }
.seg button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.seg button.seg-train { color: var(--ink); font-weight: 700; box-shadow: inset 0 0 0 1.5px var(--ink); }
.seg button.seg-train[aria-pressed="true"] { box-shadow: none; color: var(--bg); }
.seg-ico { font-size: 10px; vertical-align: 1px; }
.lagerinfo { margin: 0 0 14px; padding: 12px 14px; border: 1px solid var(--line); border-left: 3px solid var(--ink);
  border-radius: 0 12px 12px 0; background: var(--surface); font-size: 14.5px; }
.lagerinfo p { margin: 0 0 6px; }
.lagerinfo p:last-child { margin-bottom: 0; }
.lagerinfo .linkish { font-size: 14.5px; }
.lagerzeile { margin-top: 2px; }
.lagerzeile .note.tiny { margin: 6px 2px 0; }
.lagerzeile .lagerinfo { margin: 8px 0 0; }
.lagerinfo.neu { margin: 10px 0 2px; }
.tools { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.tool.file { position: relative; display: inline-flex; align-items: center; }
.tool.file input { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; pointer-events: none; }
.tool.file:focus-within { outline: 2px solid var(--ink); outline-offset: 2px; }
.xfer-msg { margin: 12px 0 0; padding: 10px 13px; border-left: 3px solid var(--ink); border-radius: 0 10px 10px 0;
  background: var(--surface); font-size: 14.5px; }
.xfer-msg.bad { border-left-color: #C0392B; }
.tool { font: inherit; font-size: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 6px 13px; cursor: pointer; }
.tool.on { background: var(--ink); color: var(--bg); border-color: var(--ink); font-weight: 700; }
.tool:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.qs { margin: 4px 0 0; padding: 0 0 0 18px; max-width: 64ch; }
.qs li { margin: 5px 0; }
.qs li::marker { color: var(--a); }
.def { margin: 9px 0 0; font-size: 14.5px; color: var(--muted); max-width: 64ch; }
.hint { margin: 2px 0 0; font-size: 15px; color: var(--muted); font-style: italic; }
.ghead.cover { width: 100%; text-align: left; font: inherit; color: var(--ink); background: none; cursor: pointer;
  border: 0; border-top: 4px solid var(--a); padding: 12px 0 0; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.ghead.cover .gname { font-family: "Bricolage Grotesque", system-ui, sans-serif; font-size: 27px; font-weight: 700; letter-spacing: -0.01em; }
.ghead.cover .count { flex-basis: 100%; color: var(--muted); font-size: 14.5px; font-style: italic; margin-top: 4px; }
.ghead.cover:hover .count { color: var(--ink); }
.ghead.cover:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
.group.covered { margin-top: 26px; }
.words { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 15.5px; }
.trainer { --a: var(--accent, var(--ink)); }
.statrow { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 20px 0 14px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 8px; text-align: center; font-size: 12.5px; color: var(--muted); }
.stat b { display: block; font-family: "Bricolage Grotesque", system-ui, sans-serif; font-size: 22px; color: var(--ink); line-height: 1.1; }
.boxbars { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; align-items: end; margin: 6px 0 4px; }
.boxbar { text-align: center; font-size: 12px; color: var(--muted); }
.boxbar .bstack { height: 54px; display: flex; align-items: flex-end; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.boxbar .bfill { width: 100%; background: var(--ink); border-radius: 0 0 7px 7px; min-height: 2px; }
.boxbar em { display: block; font-style: normal; color: var(--ink); font-weight: 700; }
.btn.big { width: 100%; padding: 15px; font-size: 17px; font-weight: 700; border-radius: 14px; margin-top: 8px; }
.btn:disabled { opacity: .45; }
.resetbox { margin-top: 18px; padding: 14px 16px; border: 1px solid var(--line); border-left: 3px solid #C0392B; border-radius: 0 12px 12px 0; background: var(--surface); }
.resetbox .d { margin: 0 0 12px; }
.resetrow { display: flex; gap: 8px; flex-wrap: wrap; }
.resetrow .btn { flex: 1 1 auto; margin-top: 0; }
.btn.danger { background: #C0392B; border-color: #C0392B; color: #fff; padding: 12px 16px; border-radius: 12px; font-size: 15px; }
.linkish:disabled { color: var(--muted); cursor: default; text-decoration: none; }
.btn.ghost { width: 100%; margin-top: 8px; background: var(--surface); color: var(--ink); border: 1px solid var(--line); padding: 12px; border-radius: 12px; font-size: 15px; }
.sub-h { font-size: 17px; margin: 26px 0 8px; }
.klapp { margin: 16px 0 0; border-top: 1px solid var(--line); }
.klapp > summary { cursor: pointer; list-style: none; padding: 13px 2px; font-size: 15px; font-weight: 600;
  display: flex; align-items: center; gap: 9px; color: var(--ink); }
.klapp > summary::-webkit-details-marker { display: none; }
.klapp > summary::before { content: "›"; font-size: 19px; line-height: 1; color: var(--muted);
  transition: transform .15s ease; }
.klapp[open] > summary::before { transform: rotate(90deg); }
.klapp > summary:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 6px; }
.klapp > *:last-child { margin-bottom: 18px; }
@media (prefers-reduced-motion: reduce) { .klapp > summary::before { transition: none; } }
.infolink, .resetlink { display: inline-block; margin-top: 18px; font-size: 15px; }
.resetlink { color: var(--muted); font-size: 14px; }
.methodbox { margin-top: 10px; }
.methodbox .rule { margin: 0 0 10px; }
.note.tiny { font-size: 12.5px; margin-top: 10px; }
.prog { height: 5px; background: var(--surface); border: 1px solid var(--line); border-radius: 99px; overflow: hidden; margin: 18px 0 10px; display: flex; }
.pfill.tail { background: repeating-linear-gradient(135deg, var(--a) 0 5px, transparent 5px 10px); opacity: .6; }
.pfill { height: 100%; background: var(--a); transition: width .3s; }
.cardmeta { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); margin-bottom: 10px; }
.cardmeta .extra { font-style: normal; margin-left: 6px; border: 1px solid var(--line); border-radius: 99px; padding: 1px 7px; font-size: 11.5px; }
.cardmeta .kind { background: color-mix(in oklab, var(--a) 16%, var(--surface)); color: var(--ink); border-radius: 99px; padding: 3px 11px; font-size: 12.5px; }
.stufen { margin: 8px 0 10px; padding-left: 22px; color: var(--muted); font-size: 14.5px; }
.stufen li { margin: 4px 0; }
.stufen b { color: var(--ink); font-weight: 600; }
.warum { margin: 0 0 10px; padding-left: 11px; border-left: 2px solid var(--a); color: var(--muted); font-size: 14.5px; }
.cardmeta .who { border: 1px solid var(--line); border-radius: 99px; padding: 2px 9px; font-size: 11.5px; white-space: nowrap; }

/* Wer lernt gerade */
.who-bar { margin-bottom: 16px; }
.who-now { display: flex; align-items: center; gap: 9px; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 11px 14px; cursor: pointer; font: inherit; color: var(--ink); text-align: left; }
.who-now:hover, .who-now:focus-visible { border-color: var(--muted); outline: none; }
.who-lab { font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.who-name { font-weight: 600; flex: 1; }
.who-arrow { color: var(--muted); font-size: 12px; }
.who-list { margin-top: 8px; border: 1px solid var(--line); border-radius: 12px; padding: 8px; background: var(--surface); display: flex; flex-direction: column; gap: 2px; }
.who-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 7px 8px; border-radius: 9px; }
.who-row.on { background: color-mix(in oklab, var(--a) 11%, var(--surface)); }
.who-pick { flex: 1; min-width: 150px; display: flex; flex-direction: column; gap: 1px; background: none; border: 0; padding: 0; cursor: pointer; font: inherit; color: var(--ink); text-align: left; }
.who-pick span { font-size: 12.5px; color: var(--muted); }
.who-edit { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; width: 100%; }
.who-input { flex: 1; min-width: 130px; padding: 8px 11px; border: 1px solid var(--line); border-radius: 9px; background: var(--bg); color: var(--ink); font: inherit; font-size: 15px; }
.who-input:focus { outline: 2px solid var(--a); outline-offset: -1px; }
.btn.tiny { padding: 7px 12px; font-size: 13.5px; border-radius: 9px; }
.btn.tiny.danger { background: #C0392B; border-color: #C0392B; color: #fff; }
.linkish.tiny { font-size: 12.5px; }
.linkish.warn { color: #C0392B; }
.addp { align-self: flex-start; margin: 4px 0 2px 8px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px 18px; }
.card.done { text-align: center; margin-bottom: 18px; }
.bigno { font-family: "Bricolage Grotesque", system-ui, sans-serif; font-size: 40px; font-weight: 700; }
.promptx { margin: 0 0 16px; font-size: 19px; line-height: 1.45; white-space: pre-line; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { font: inherit; font-size: 16px; text-align: left; padding: 13px 15px; border-radius: 11px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; }
.opt:disabled { cursor: default; }
.opt.right { border-color: var(--a); background: color-mix(in oklab, var(--a) 18%, var(--surface)); font-weight: 700; }
.opt.wrong { opacity: .55; text-decoration: line-through; }
.opt.q { font-size: 15.5px; line-height: 1.45; }
.opt.q.wrong { text-decoration: none; opacity: .45; }
.reveal { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); }
.answ { font-family: "Bricolage Grotesque", system-ui, sans-serif; font-size: 27px; font-weight: 700; margin-bottom: 4px; }
.rowlab { margin: 12px 0 6px; font-size: 13px; color: var(--muted); }
.rowlab:first-child { margin-top: 0; }
.wchips { display: flex; flex-wrap: wrap; gap: 7px; }
.wchip { font: inherit; font-size: 16px; padding: 7px 13px; border-radius: 99px; cursor: pointer;
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
.wchip.on { border-color: var(--a); background: color-mix(in oklab, var(--a) 18%, var(--surface)); font-weight: 700; }
.wchip:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.peek { margin-top: 14px; padding: 13px 15px; border-radius: 12px; border: 1px solid var(--line);
  border-left: 3px solid var(--a); background: var(--bg); }
.peekhead { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
.peekhead b { font-size: 18px; }
.peekhead span { color: var(--muted); font-size: 13.5px; }
.peek .d { margin: 0; }
.peek .def { margin: 7px 0 0; }
.neinlist { gap: 10px; }
.item.nein { border-left: 3px solid var(--a); background: var(--surface); border-radius: 0 12px 12px 0; padding: 14px 16px; }
.frage { margin: 0 0 8px; font-size: 18px; font-weight: 700; font-family: "Bricolage Grotesque", system-ui, sans-serif; }
.antwort { margin: 0; max-width: 64ch; }
.annot { margin: 10px 0 0; display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: center; font-size: 13.5px; color: var(--muted); }
.annot .wchip { font-size: 14px; padding: 4px 10px; }
.enlist { gap: 8px; }
.item.en { border-left: 3px solid var(--a); background: var(--surface); border-radius: 0 12px 12px 0; padding: 12px 16px; }
.enword { margin: 0 0 6px; font-size: 17px; font-weight: 700; font-style: italic;
  font-family: "Bricolage Grotesque", system-ui, sans-serif; letter-spacing: -0.01em; }
.item.en .antwort { font-size: 16px; font-weight: 600; }
.item.en .d { margin: 4px 0 0; max-width: 66ch; color: var(--muted); font-size: 14.5px; }
.item.en .warum { margin: 9px 0 0; font-size: 13.5px; }
.ergtag { margin-left: 9px; font-family: system-ui, sans-serif; font-style: normal; font-weight: 600;
  font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted);
  border: 1px solid var(--line); border-radius: 999px; padding: 2px 7px; vertical-align: middle; }
.annot .muted { color: var(--muted); }
.anf li { margin: 7px 0; }
.falle { margin: 0 0 10px; max-width: 70ch; }
.grades { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 18px; }
.grade { font: inherit; font-size: 14.5px; padding: 13px 6px; border-radius: 11px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; }
.grade.g2 { border-color: var(--ink); background: var(--ink); color: var(--bg); font-weight: 700; }

const NEG = [
  { id: "aerger", bereich: "Anders als es sollte", name: "Ärger", sub: "Eine Grenze überschritten", extraLabel: "Eigene Art:", ladder: true, accent: "#C0392B", accentD: "#E0685A",
    note: "Die Leiter misst die Stärke. ärgerlich und verärgert stehen gleichauf: ärgerlich ist hier die gereizte Stimmung ohne fassbaren Auslöser, verärgert die Reaktion auf etwas Bestimmtes. Im Alltag werden beide oft gleich gebraucht. Drei Wörter stehen daneben, weil sie sich in der Art unterscheiden: ungeduldig ist Ärger über Tempo, geladen ist aufgestauter Ärger, den ich noch nicht zeige, zornig ist gerichteter Ärger über ein Unrecht.",
    items: [
    { w: "irritiert", d: "Etwas kommt mir quer und bringt mich kurz aus dem Tritt. Ich runzle innerlich die Stirn, und es vergeht, sobald es aufhört." },
    { w: "genervt", d: "Dasselbe stört mich zum wiederholten Mal, und ich halte es immer schlechter aus. Nicht die Sache selbst reizt mich, sondern dass sie immer wiederkommt." },
    { w: "ärgerlich", d: "Ich bin gereizt und schnell auf hundert, ohne einen bestimmten Auslöser nennen zu können. Eine Stimmung, die gerade über allem liegt.", vs: "verärgert" },
    { w: "verärgert", same: true, d: "Etwas Bestimmtes hat mir die Laune verdorben, und ich kann es auf den Punkt benennen: diese Bemerkung, dieser Termin, dieses Versäumnis. Es wurmt mich an dieser einen Sache, nicht überall.", vs: "ärgerlich" },
    { w: "sauer", d: "Ich bin jemandem böse und lasse es ihn spüren, eher kurz angebunden. Umgangssprachlich und meist auf eine Person gemünzt." },
    { w: "aufgebracht", d: "Ich bin sichtbar erregt: Die Stimme wird lauter, ich rede schneller und gestikuliere." },
    { w: "wütend", d: "Heiss und drängend, ich spüre es im ganzen Körper und will sofort handeln. Impulsiv, nicht durchdacht.", vs: "zornig" },
    { w: "explosiv", d: "Gleich platzt es aus mir heraus. Ich halte mich nur noch mit Mühe zurück, und man sieht es mir an." },
    { w: "ungeduldig", extra: true, d: "Es geht mir zu langsam. Ich will, dass es endlich weitergeht, und kann das Warten kaum aushalten." },
    { w: "geladen", extra: true, d: "Seit einer Weile sammelt sich etwas in mir an, das ich nicht zeige. Nach aussen wirke ich gefasst, aber ein kleiner Anlass würde reichen." },
    { w: "zornig", extra: true, d: "Ein Unrecht empört mich, und mein Groll richtet sich klar dagegen: Das darf so nicht sein. Anders als bei Wut bleibe ich dabei kühl und beherrscht.", vs: "wütend" }
  ]},
  { id: "enttaeuschung", bereich: "Anders als es sollte", name: "Enttäuschung & Verletzung", sub: "Eine Erwartung nicht erfüllt", ladder: false, accent: "#A5581B", accentD: "#D98C4E",
    note: "Keine Leiter: Die ersten vier unterscheiden sich im Auslöser — eine Bilanz, eine nicht erfüllte Erwartung, ein blockierter Weg, ein persönlicher Treffer. Nur verbittert ist eindeutig das Späteste und Festeste.",
    items: [
    { w: "unzufrieden", d: "Was ist, entspricht nicht dem, was sein sollte. Eine nüchterne Bilanz, kein heisses Gefühl." },
    { w: "enttäuscht", d: "Ich hatte mich auf etwas Schönes gefreut oder fest damit gerechnet, und es ist nicht gekommen. Je grösser die Vorfreude war, desto schwerer wiegt es.", vs: "frustriert" },
    { w: "frustriert", d: "Ich komme nicht weiter, obwohl ich es immer wieder versuche. Der Weg zum Ziel ist blockiert, darin steckt auch Ärger.", vs: "enttäuscht" },
    { w: "verletzt", d: "Das Verhalten eines anderen hat mich persönlich getroffen, es tut innerlich weh." },
    { w: "verbittert", d: "Was mich früher gekränkt hat, ist zu Groll erstarrt. Er hängt nicht mehr an einem Anlass, sondern färbt seit Langem alles ein." }
  ]},
  { id: "angst", bereich: "Bedrohung", name: "Angst", sub: "Die Gefahr ist da, der Schaden noch nicht", extraLabel: "Daneben:", ladder: true, accent: "#7045AE", accentD: "#A788D8",
    note: "Die Leiter misst die Stärke: besorgt bleibt im Kopf, beunruhigt erreicht schon den Körper, ängstlich rechnet mit Gefahr, panisch kann nicht mehr klar denken. unruhig sitzt daneben, weil es keinen Gegenstand braucht und sich als Bewegungsdrang zeigt; alarmiert, weil es der plötzliche Moment des Erkennens ist.",
    items: [
    { w: "besorgt", d: "Meine Gedanken kreisen um etwas, das schiefgehen könnte. Das spielt sich im Kopf ab, der Körper ist nicht beteiligt.", vs: "beunruhigt" },
    { w: "beunruhigt", d: "Etwas Bestimmtes lässt mich nicht los, und es erreicht schon den Körper: ein flaues Gefühl, ich horche immer wieder darauf. Mit echter Gefahr rechne ich noch nicht.", vs: ["besorgt", "unruhig"] },
    { w: "ängstlich", vs: "besorgt", d: "Mir ist eng und mulmig. Ich rechne mit Gefahr, gehe vorsichtig heran und würde am liebsten ausweichen." },
    { w: "panisch", d: "Ein Schrecken überrollt mich, ich kann nicht mehr klar denken und will nur noch weg." },
    { w: "unruhig", extra: true, vs: ["beunruhigt", "angespannt"], d: "Ich kann nicht stillsitzen, bin zappelig und getrieben, ohne sagen zu können wovor. Es sitzt im Körper, nicht im Gedanken." },
    { w: "alarmiert", extra: true, vs: "panisch", d: "Etwas hat mich schlagartig wachgemacht. Ich habe eine Gefahr erkannt und bin bereit zu handeln." }

function migrate(raw) {
  if (!raw || typeof raw !== "object") return null;
  if (raw.profiles && typeof raw.profiles === "object") {
    const out = { v: 2, profiles: {}, deleted: {}, current: raw.current, updated: raw.updated || 0 };
    Object.keys(raw.deleted || {}).forEach(k => { out.deleted[k] = raw.deleted[k] || 0; });
    Object.keys(raw.profiles).forEach(k => {
      const p = raw.profiles[k] || {};
      out.profiles[k] = { name: cleanName(p.name, "Ohne Namen"), cards: p.cards || {},
        decks: cleanDecks(p.decks), coreOnly: p.coreOnly !== false, fill: p.fill !== false,
        len: cleanLen(p.len), fw: cleanFW(p.fw),
        resetAt: fin(p.resetAt) ? p.resetAt : 0, deckReset: cleanResets(p.deckReset),
        created: p.created || 0, updated: p.updated || raw.updated || 0 };
    });
    if (!out.profiles[out.current]) out.current = Object.keys(out.profiles)[0];
    return out.current ? out : null;
  }
  if (raw.cards) {   // v1: ein einziger Lernender, noch ohne Namen
    const id = newId(), ts = raw.updated || Date.now();
    return { v: 2, current: id, updated: ts, deleted: {},
      profiles: { [id]: { name: "Ich", cards: raw.cards, decks: cleanDecks(raw.decks),
        coreOnly: raw.coreOnly !== false, fill: raw.fill !== false, len: cleanLen(raw.len), fw: cleanFW(raw.fw),

// Pro Profil gewinnt der neuere Stand. Ein gelöschtes Profil bleibt gelöscht, solange
// die Löschung neuer ist als der Stand, der von der anderen Seite kommt.
function mergeStores(local, remote) {
  if (!remote) return local;
  if (!local) return remote;
  const deleted = Object.assign({}, remote.deleted || {});
  Object.keys(local.deleted || {}).forEach(k => {
    deleted[k] = Math.max(deleted[k] || 0, local.deleted[k] || 0); });
  const profiles = {};
  new Set(Object.keys(local.profiles).concat(Object.keys(remote.profiles))).forEach(id => {
    const a = local.profiles[id], b = remote.profiles[id];
    const win = !a ? b : !b ? a : ((b.updated || 0) > (a.updated || 0) ? b : a);
    if ((deleted[id] || 0) > (win.updated || 0)) return;
    profiles[id] = win;
  });
  const ids = Object.keys(profiles);
  if (!ids.length) return freshStore();
  let current = profiles[local.current] ? local.current
    : profiles[remote.current] ? remote.current : ids[0];
  return { v: 2, profiles, deleted, current,
    updated: Math.max(local.updated || 0, remote.updated || 0) };
}

function cleanCards(cards) {
  const out = {};
  if (!cards || typeof cards !== "object") return out;
  Object.keys(cards).forEach(k => {
    const c = cards[k];
    if (BAD_KEY(k) || !bekannt(k) || !c || typeof c !== "object") return;
    if (!Number.isInteger(c.box) || c.box < 1 || c.box > MAXBOX || !fin(c.due)) return;
    const e = {};
    Object.keys(c).forEach(f => { if (!BAD_KEY(f)) e[f] = c[f]; });
    NUM_FIELDS.forEach(f => { if (f in e && !fin(e[f])) delete e[f]; });
    out[k] = e;
  });
  return out;
}

// Liest eine gesicherte Datei. Gibt einen Stand in der üblichen Form zurück oder null.
function leseLernstand(data) {
  if (!data || typeof data !== "object" || data.app !== XFER_APP) return null;
  const raw = data.store;
  if (!raw || typeof raw !== "object" || !raw.profiles || typeof raw.profiles !== "object") return null;
  const ps = {};
  Object.keys(raw.profiles).forEach(k => {
    if (!BAD_KEY(k) && raw.profiles[k] && typeof raw.profiles[k] === "object") ps[k] = raw.profiles[k]; });
  const m = migrate({ profiles: ps, current: typeof raw.current === "string" ? raw.current : undefined,
    updated: fin(raw.updated) ? raw.updated : 0 });
  if (!m) return null;
  Object.keys(m.profiles).forEach(k => { const p = m.profiles[k];
    p.cards = cleanCards(p.cards);
    p.created = fin(p.created) ? p.created : 0; p.updated = fin(p.updated) ? p.updated : 0; });
  return m;
}

const irgendeinDeck = d => DECKS.some(x => d && d[x.id]);

// Eine Person, zwei Stände: pro Karte gewinnt die zuletzt geübte. Einstellungen und
// Name kommen vom Gerät, auf dem zuletzt gelernt wurde.
function mergeProfile(a, b) {           // a: hier, b: aus der Datei
  const resetAt = Math.max(a.resetAt || 0, b.resetAt || 0);
  const deckReset = Object.assign({}, a.deckReset || {});
  Object.keys(b.deckReset || {}).forEach(d => { deckReset[d] = Math.max(deckReset[d] || 0, b.deckReset[d]); });
  const grenze = k => Math.max(resetAt, ...decksOf(k).map(d => deckReset[d] || 0));
  const ac = a.cards || {}, bc = b.cards || {}, cards = {};
  let neu = 0, aktualisiert = 0, entfernt = 0;
  new Set(Object.keys(ac).concat(Object.keys(bc))).forEach(k => {
    const ca = ac[k], cb = bc[k], g = grenze(k);
    const okA = !!ca && cardStamp(ca) >= g, okB = !!cb && cardStamp(cb) >= g;
    if (!okA && !okB) { if (ca) entfernt++; return; }
    const win = okA && okB ? newerCard(ca, cb) : okA ? ca : cb;
    cards[k] = win;
    if (win === cb && win !== ca) {
      if (!ca) neu++;
      else if (JSON.stringify(ca) !== JSON.stringify(cb)) aktualisiert++;
    } else if (ca && !okA) entfernt++;
  });
  const base = (b.updated || 0) > (a.updated || 0) ? b : a;
  // Kommt die Datei aus einer anderen Fassung, können dort nur Decks an sein, die es hier
  // nicht gibt. Dann bleibt die hiesige Auswahl, damit der Trainer nicht leer läuft.
  const decks = irgendeinDeck(base.decks) ? base.decks : irgendeinDeck(a.decks) ? a.decks : cleanDecks(DEF_DECKS);
  const profile = Object.assign({}, base, { cards, resetAt, deckReset, decks: cleanDecks(decks),
    created: Math.min(a.created || Date.now(), b.created || Date.now()),
    updated: Math.max(a.updated || 0, b.updated || 0) });
  return { profile, neu, aktualisiert, entfernt };
}

// Führt einen geladenen Stand in den hiesigen ein. Personen werden über ihre Kennung
// erkannt, sonst über den Namen. Eine unberührte, leere «Ich» von einem frischen Gerät
// verschwindet, wenn mit der Datei jemand anderes dazukommt.
function importStore(local, inc) {
  const now = Date.now(), norm = s => (s || "").toLocaleLowerCase("de").trim();
  const profiles = Object.assign({}, local.profiles);
  const deleted = Object.assign({}, local.deleted || {});
  const used = new Set(), report = [];
  let added = false, current = null;
  Object.keys(inc.profiles).forEach(ib => {
    const pb = inc.profiles[ib];
    if ((deleted[ib] || 0) > (pb.updated || 0)) return;   // hier gelöscht, nachdem die Datei entstand
    let tid = profiles[ib] && !used.has(ib) ? ib : null;
    if (!tid) tid = Object.keys(profiles).find(id => !used.has(id) && !(id !== ib && inc.profiles[id])
      && norm(profiles[id].name) === norm(pb.name)) || null;
    if (tid) {
      const r = mergeProfile(profiles[tid], pb);
      profiles[tid] = r.profile;
      report.push({ name: r.profile.name, neu: r.neu, aktualisiert: r.aktualisiert, entfernt: r.entfernt,
        gesamt: Object.keys(r.profile.cards).length });
    } else {
      tid = profiles[ib] ? newId() : ib;
      if (!irgendeinDeck(pb.decks)) pb.decks = cleanDecks(DEF_DECKS);
      profiles[tid] = pb; added = true;
      report.push({ name: pb.name, hinzu: true, gesamt: Object.keys(pb.cards).length });
    }
    used.add(tid);
    if (ib === inc.current || !current) current = tid;
  });
  if (!report.length) return null;
  if (added) Object.keys(local.profiles).forEach(id => {
    const p = profiles[id];
    if (!used.has(id) && p && p.name === "Ich" && !Object.keys(p.cards || {}).length) {
      delete profiles[id]; deleted[id] = now; }
  });
  return { store: { v: 2, profiles, deleted, current, updated: now }, report };
}

const karten = n => n + (n === 1 ? " Karte" : " Karten");
function berichte(report) {
  return "Geladen. " + report.map(r => {
    if (r.hinzu) return "«" + r.name + "» neu angelegt, mit " + karten(r.gesamt) + ".";
    const teile = [];
    if (r.neu) teile.push(karten(r.neu) + " dazu");
    if (r.aktualisiert) teile.push(r.aktualisiert + " aktualisiert");
    if (r.entfernt) teile.push(r.entfernt + " wegen Zurücksetzen entfernt");
    return teile.length
      ? "«" + r.name + "»: " + teile.join(", ") + ". Jetzt " + karten(r.gesamt) + " angefangen."
      : "«" + r.name + "» war hier schon auf dem neuesten Stand.";
  }).join(" ");
}

// Teilen-Knopf nur auf Handy und Tablet, und nur wenn der Browser Dateien teilen kann.
// Manche Android-Browser teilen keine .json-Dateien, wohl aber .txt; der Inhalt ist derselbe.
const TEILEN = (() => {
  try {
    if (!navigator.canShare || !window.matchMedia || !window.matchMedia("(pointer: coarse)").matches) return null;
    if (navigator.canShare({ files: [new File(["{}"], "t.json", { type: "application/json" })] })) return "json";
    if (navigator.canShare({ files: [new File(["{}"], "t.txt", { type: "text/plain" })] })) return "txt";
  } catch (e) {}
  return null;

// Schwellenfragen pro Wort, für die oberste Stufe
const SCHWELLEN_BY_W = {};
SCHWELLEN.forEach(x => { (SCHWELLEN_BY_W[x.a] = SCHWELLEN_BY_W[x.a] || []).push(x);
                         (SCHWELLEN_BY_W[x.b] = SCHWELLEN_BY_W[x.b] || []).push(x); });

// Sechs Stufen für die Wortkarten der drei Hauptmodi. Jede ist auf eine ANDERE Art
// schwerer, nicht bloss hilfsärmer: erst das Thema, dann die Nuance, dann die eine
// Grenze, dann freier Abruf, dann die Richtung umgedreht, dann die Abgrenzung selbst
// produzieren. Ab Fach 5 wechseln die beiden obersten ab — sonst käme die schwerste
// Übung nur alle 35 Tage dran.
const STUFEN = [
  ["Thema treffen", "Beschreibung, vier Optionen aus verschiedenen Töpfen."],
  ["Nuance treffen", "Vier Optionen aus demselben Topf, der Abgrenzungspartner immer dabei."],
  ["Die eine Grenze", "Nur zwei Optionen: das Wort und sein Abgrenzungspartner."],
  ["Frei abrufen", "Beschreibung, kein Angebot mehr."],
  ["Umgekehrt", "Wort zeigen, Bedeutung selbst sagen — die Richtung, die im Gespräch zählt."],
  ["Abgrenzen", "Wort zeigen, selbst nennen, wovon es sich abgrenzt und woran du es unterscheidest."]
];
// Fach und Stufe sind zwei verschiedene Dinge: das Fach sagt, WANN eine Karte
// wiederkommt, die Stufe, WIE SCHWER die Aufgabe ist. Bei einem Patzer fällt das Fach
// klassisch auf 1 — die Karte soll gleich wieder dran sein. Die Stufe fällt dagegen
// nur eine zurück, denn wer bei Stufe 5 stolpert, braucht nicht wieder Vierfachauswahl.
const MAXSTUFE = 6;
const gradVon = p => p && p.st !== undefined ? p.st : (p && p.box) || 1;
const stufe = (grad, seen) => grad <= 4 ? grad : ((seen % 2) ? 6 : 5);
// Umschreiben: fünf Stufen, und die ersten vier gehen von den FRAGEN aus. Erst zuletzt
// kommt die Richtung, die der Trainer früher von Anfang an verlangt hat: Bedürfnis
// zeigen, Fragen selbst erfinden. Keine Abwechslung oben — Stufe 5 ist das Ziel und
// darf jedes Mal dran sein.
const stufeUm = box => Math.min(5, box);
const STUFEN_UM = [
  ["Thema treffen", "Zwei Umschreibungen, vier Bedürfnisse aus verschiedenen Töpfen zur Auswahl."],
  ["Nuance treffen", "Vier Bedürfnisse aus demselben Topf."],
  ["Die eine Grenze", "Nur zwei: das Bedürfnis und sein Abgrenzungspartner."],
  ["Frei benennen", "Zwei Umschreibungen, das Bedürfnis selbst nennen."],
  ["Selbst formulieren", "Bedürfnis zeigen, die Fragen selbst erfinden."]
];
const stufeUmq = box => Math.min(4, box);
const STUFEN_UMQ = [
  ["Thema treffen", "Vier Fragen, die anderen aus fremden Bereichen."],
  ["Naher Bereich", "Die anderen Fragen kommen aus demselben Bereich."],
  ["Derselbe Topf", "Alle vier Fragen gehören zu Bedürfnissen aus einem Topf."],
  ["Die eine Grenze", "Drei Fragen, die beiden anderen vom Abgrenzungspartner."]
];
// Welche der drei Umschreibungen diesmal die richtige ist, rotiert über die Begegnungen.
const frageVon = (w, seen) => { const qs = U[w] || []; return qs.length ? qs[(seen || 0) % qs.length] : null; };

const partnerVon = w => ((ITEM[w] || {}).vs || []).filter(v => ITEM[v])[0] || null;

// Umschreibungen anderer Bedürfnisse als Ablenkung. Je höher die Stufe, desto näher
// liegen sie: erst fremde Bereiche, dann derselbe Bereich, dann derselbe Topf,
// zuletzt der Abgrenzungspartner.
function frageAblenker(w, su, n) {
  const gid = WORD_GROUP[w], g = GROUP_BY_ID[gid], ber = g && g.bereich;
  const hatFragen = x => x !== w && (U[x] || []).length > 0;
  const aus = gs => gs.flatMap(x => x.items.map(i => i.w)).filter(hatFragen);
  const pa = partnerVon(w);
  let quelle;
  if (su >= 4 && pa && (U[pa] || []).length) quelle = [pa];
  else if (su >= 3) quelle = aus([g]);
  else if (su === 2) quelle = aus(NEEDS.filter(x => x.bereich === ber && x.id !== gid));
  else quelle = aus(NEEDS.filter(x => x.bereich !== ber));
  if (!quelle.length) quelle = aus(NEEDS.filter(x => x.id !== gid));
  if (!quelle.length) return [];
  const woerter = shuffle(quelle), out = [];
  // Erst je eine Frage pro Wort, danach die zweite und dritte desselben Worts —
  // so stammen beim Abgrenzungspartner beide Ablenker von ihm.
  for (let i = 0; out.length < n && i < woerter.length * 3; i++) {
    const x = woerter[i % woerter.length], qs = U[x] || [];
    const q = qs[Math.floor(i / woerter.length) % qs.length];
    if (q && out.indexOf(q) < 0) out.push(q);
  }
  return out;
}

function buildPool(decks, coreOnly) {
  const out = [];
  ["neg", "pos", "needs"].forEach(m => {
    if (!decks[m] && !decks.struktur) return;
    MG[m].forEach(g => {
      g.items.forEach(i => {
        if (coreOnly && !i.core) return;
        if (decks[m]) out.push({ key: m + "|" + i.w, kind: "wort", mode: m, gid: g.id, w: i.w });
        if (decks.struktur) out.push({ key: "t|" + m + "|" + i.w, kind: "topf", mode: m, gid: g.id, w: i.w });
      });
      if (decks.struktur) {
        out.push({ key: "g|" + m + "|" + g.id, kind: "bereich", mode: m, gid: g.id });
        out.push({ key: "w|" + m + "|" + g.id, kind: "woerter", mode: m, gid: g.id });
      }
    });
    if (decks.struktur) (BER[m] || []).forEach((b, k) =>
      out.push({ key: "b|" + m + "|" + k, kind: "toepfe", mode: m, gid: "ber" + m + k, ber: b }));
  });
  if (decks.um) NEEDS.forEach(g => g.items.forEach(i => {
    if (coreOnly && !i.core) return;
    out.push({ key: "u|" + i.w, kind: "um", mode: "needs", gid: g.id, w: i.w });
  }));
  if (decks.umq) NEEDS.forEach(g => g.items.forEach(i => {
    if (coreOnly && !i.core) return;
    if (!(U[i.w] || []).length) return;
    out.push({ key: "q|" + i.w, kind: "umq", mode: "needs", gid: g.id, w: i.w });
  }));
  if (decks.schwelle) SCHWELLEN.forEach((x, k) => {
    if (coreOnly && !(ITEM[x.a].core || ITEM[x.b].core)) return;   // eine Seite im Kern genügt
    out.push({ key: "w|" + k, kind: "schwelle", gid: x.g, sw: x });
  });
  return out;
}

// Welche Kartenschlüssel zu welchem Deck gehören. Abgeleitet, indem der Vorrat je
// Deck allein gebaut wird — so kann sich das Schlüsselformat ändern, ohne dass hier
// eine zweite, veraltende Liste von Präfixen mitgepflegt werden muss.
const DECK_KEYS = {};
DECKS.forEach(d => {
  const only = {}; DECKS.forEach(x => { only[x.id] = x.id === d.id; });
  DECK_KEYS[d.id] = new Set(buildPool(only, false).map(c => c.key));
});

// Wackelig: mehrfach gepatzt und noch in einem tiefen Fach. Der Zähler wird bei
// Fach 4 gelöscht — wer dreimal an seinen Fälligkeitstagen fehlerfrei abruft, hat sich
// erholt, und das Etikett soll dann nicht an alten Patzern hängen bleiben. Danach
// braucht es wieder drei neue Patzer.
// Zwei Patzertage reichen — ein einzelner Fehler passiert jeder Karte und sagt nichts.
// Dafür ist das Etikett schnell wieder weg: zwei saubere Abrufe heben die Karte auf
// Fach 3, und dort wird der Zähler gelöscht.
const WACKEL = 2;
const WACKEL_FREI = 3;
const istWackelig = pp => !!pp && (pp.lapses || 0) >= WACKEL && (pp.box || 1) < WACKEL_FREI;

function interleave(list) {
  const pool = shuffle(list.slice()), out = [];
  while (pool.length) {
    let i = out.length ? pool.findIndex(c => c.gid !== out[out.length - 1].gid) : 0;
    if (i < 0) i = 0;
    out.push(pool.splice(i, 1)[0]);
  }
  return out;
}

// hart = aus demselben Topf, Abgrenzungspartner zuerst. Sonst aus anderen Töpfen,
// sodass nur das Thema zu treffen ist.
function distractors(card, n, hart) {
  const g = GROUP_BY_ID[card.gid];
  const item = ITEM[card.w];
  const pick = [];
  if (hart === false) {
    shuffle(MG[card.mode].filter(x => x.id !== card.gid).flatMap(x => x.items.map(i => i.w)))
      .forEach(w => { if (pick.length < n) pick.push(w); });
  } else {
    (item.vs || []).forEach(v => { if (ITEM[v] && pick.indexOf(v) < 0) pick.push(v); });
    shuffle(g.items.map(i => i.w).filter(w => w !== card.w && pick.indexOf(w) < 0)).forEach(w => { if (pick.length < n) pick.push(w); });
  }
  if (pick.length < n) {
    const all = MG[card.mode].flatMap(x => x.items.map(i => i.w)).filter(w => w !== card.w && pick.indexOf(w) < 0);
    shuffle(all).forEach(w => { if (pick.length < n) pick.push(w); });
  }
  return pick.slice(0, n);
}

function Trainer({ profile, save, bar, transfer, synced, mehrere }) {
  const [prog, setProg] = useState(() => profile.cards || {});
  const [decks, setDecks] = useState(() => cleanDecks(profile.decks));
  const [coreOnly, setCoreOnly] = useState(() => profile.coreOnly !== false);
  const [fill, setFill] = useState(() => profile.fill !== false);
  const [len, setLen] = useState(() => cleanLen(profile.len));
  const [fw, setFw] = useState(() => cleanFW(profile.fw));
  const [queue, setQueue] = useState(null);
  const [at, setAt] = useState(0);
  const [shown, setShown] = useState(false);
  const [picked, setPicked] = useState(null);
  const [tally, setTally] = useState({ ok: 0, n: 0 });
  const [retry, setRetry] = useState({});
  const [peek, setPeek] = useState(null);
  const [plan, setPlan] = useState(0);
  const [armed, setArmed] = useState(false);   // Reset zweistufig
  const [armedDeck, setArmedDeck] = useState(null);

  const resets = useRef(cleanResets(profile.deckReset));
  const persist = (cards, dk, co, fi, le, fq, extra) =>
    save(Object.assign({ cards, decks: cleanDecks(dk), coreOnly: co, fill: fi === undefined ? fill : fi,
      len: le === undefined ? len : le, fw: cleanFW(fq === undefined ? fw : fq) }, extra || {}));
  const NEU = neuProRunde(len);
  const setDeck = id => { const d = Object.assign({}, decks, { [id]: !decks[id] }); setDecks(d); persist(prog, d, coreOnly); };
  const setCore = v => { setCoreOnly(v); persist(prog, decks, v); };
  const setFillMode = v => { setFill(v); persist(prog, decks, coreOnly, v); };
  const setLenMode = v => { setLen(v); persist(prog, decks, coreOnly, undefined, v); };
  const setQuelle = id => { const n = Object.assign({}, fw, { [id]: !fw[id] });
    setFw(n); persist(prog, decks, coreOnly, undefined, undefined, n); };

  useEffect(() => { if (armedDeck === null) return;
    const id = setTimeout(() => setArmedDeck(null), 8000); return () => clearTimeout(id); }, [armedDeck]);

  // Fortschritt eines einzelnen Decks löschen, der Rest bleibt unberührt.
  const resetDeck = id => {
    const ks = DECK_KEYS[id] || new Set();
    const np = {};
    Object.keys(prog).forEach(k => { if (!ks.has(k)) np[k] = prog[k]; });
    resets.current = Object.assign({}, resets.current, { [id]: Date.now() });
    setProg(np); persist(np, decks, coreOnly, undefined, undefined, undefined, { deckReset: resets.current });
    setQueue(null); setArmedDeck(null);
  };
  const deckStand = useMemo(() => DECKS.map(d => {
    const ks = DECK_KEYS[d.id] || new Set();
    let n = 0; Object.keys(prog).forEach(k => { if (ks.has(k)) n++; });
    return { id: d.id, label: d.label, n };
  }).filter(x => x.n > 0), [prog]);

  const pool = useMemo(() => buildPool(decks, coreOnly), [decks, coreOnly]);
  const opts = useMemo(() => {
    if (!queue || at >= queue.length) return [];
    const c = queue[at], pp = prog[c.key] || {};
    if (c.kind === "topf") {
      const others = shuffle(MG[c.mode].filter(x => x.id !== c.gid)).slice(0, 3).map(x => x.name);
      return shuffle(others.concat([GROUP_BY_ID[c.gid].name]));
    }
    if (c.kind === "bereich") {
      const right = GROUP_BY_ID[c.gid].bereich;
      const others = shuffle((BER[c.mode] || []).filter(b => b !== right)).slice(0, 3);
      return shuffle(others.concat([right]));
    }
    if (c.kind === "um") {
      const su = stufeUm(gradVon(pp));
      if (su === 1) return shuffle(distractors(c, 3, false).concat([c.w]));
      if (su === 2) return shuffle(distractors(c, 3, true).concat([c.w]));
      if (su === 3) {
        const pa = partnerVon(c.w);
        return pa ? shuffle([pa, c.w]) : shuffle(distractors(c, 3, true).concat([c.w]));
      }
      return [];
    }
    if (c.kind === "umq") {
      const su = stufeUmq(gradVon(pp));
      const richtig = frageVon(c.w, pp.seen);
      return shuffle(frageAblenker(c.w, su, su >= 4 ? 2 : 3).concat(richtig ? [richtig] : []));
    }
    if (c.kind === "wort") {
      const st = stufe(gradVon(pp), pp.seen || 0);
      if (st === 1) return shuffle(distractors(c, 3, false).concat([c.w]));
      if (st === 2) return shuffle(distractors(c, 3, true).concat([c.w]));
      if (st === 3) {
        const pa = partnerVon(c.w);
        // Ohne Abgrenzungspartner bleibt es bei vier harten Optionen: eine Zweierwahl
        // mit einem beliebigen Topfnachbarn wäre leichter, nicht schwerer.
        return pa ? shuffle([pa, c.w]) : shuffle(distractors(c, 3, true).concat([c.w]));
      }
      return [];
    }
    return [];
  }, [queue, at]);
  const t = day();
  const stats = useMemo(() => {
    let due = 0, fresh = 0, hard = 0, boxes = [0, 0, 0, 0, 0, 0];
    pool.forEach(c => {
      const p = prog[c.key];
      if (!p) { fresh++; return; }
      boxes[Math.min(MAXBOX, p.box) - 1]++;
      if (p.due <= t) due++;
      if (istWackelig(p)) hard++;
    });
    return { due, fresh, hard, boxes, total: pool.length, learned: pool.length - fresh };
  }, [pool, prog, t]);

  // Eine Runde zusammenstellen. Dieselbe Funktion liefert die Zahl auf dem Startknopf,
  // damit dort nicht eine Länge versprochen wird, die die Runde nicht einhält.
  const baueRunde = () => {
    // 1. fällig: schwaches Fach zuerst, bei gleichem Fach das länger Überfällige
    const due = pool.filter(c => prog[c.key] && prog[c.key].due <= t)
      .sort((a, b) => (prog[a.key].box - prog[b.key].box) || (prog[a.key].due - prog[b.key].due));
    // 2. neue Karten, höchstens NEU
    const freshAll = shuffle(pool.filter(c => !prog[c.key]));
    const picked = due.slice(0, len).concat(freshAll.slice(0, NEU)).slice(0, len);
    const taken = {}; picked.forEach(c => { taken[c.key] = 1; });
    if (!fill) return picked;
    const platz = () => len - picked.length;
    const nimm = (list, mark) => list.slice(0, platz())
      .forEach(c => { taken[c.key] = 1; picked.push(mark ? Object.assign({}, c, mark) : c); });
    // Was heute schon dran war, wird nicht noch einmal vorgezogen: eine Karte eine
    // halbe Stunde später erneut zu zeigen bringt nichts, der Abstand ist das
    // Wirkprinzip. Fürs Fällige gilt das nicht — eine „Nochmal“-Karte SOLL heute
    // wiederkommen, die steht in Stufe 1 und nicht hier.
    // Karten, die vor der Einführung von "last" bewertet wurden, haben kein Datum.
    // up === t fängt sie ab: up wird nur beim Fachwechsel und beim Patzer gesetzt,
    // beides passiert heute. Damit greift der Filter auch für Altbestand.
    const heuteSchon = c => { const pp = prog[c.key];
      return !!pp && (pp.last === t || pp.up === t); };
    // 3. wackelige: mehrfach gepatzt und noch in einem tiefen Fach. Hier bringt
    //    eine zusätzliche Begegnung am meisten, auch wenn sie den Abstand verkürzt.
    if (platz() > 0 && fw.hard) nimm(
      pool.filter(c => !taken[c.key] && !heuteSchon(c) && istWackelig(prog[c.key]))
        .sort((a, b) => (prog[b.key].lapses || 0) - (prog[a.key].lapses || 0)),
      { early: true, shaky: true });
    // 4. weitere neue Karten über den Deckel hinaus
    if (platz() > 0 && fw.fresh) nimm(freshAll.filter(c => !taken[c.key]));
    // 5. vorgezogen: was als Nächstes fällig würde. Zuletzt, weil es nur den Abstand kürzt.
    if (platz() > 0 && fw.early) nimm(
      pool.filter(c => prog[c.key] && !taken[c.key] && !heuteSchon(c) && prog[c.key].due > t)
        .sort((a, b) => (prog[a.key].due - prog[b.key].due) || (prog[a.key].box - prog[b.key].box)),
      { early: true });
    return picked;
  };
  const vorschau = useMemo(() => baueRunde().length, [pool, prog, t, len, fill, fw, NEU]);

  const start = kind => {
    if (!pool.length) return;
    let q;
    if (kind === "hard") {
      q = interleave(pool.filter(c => istWackelig(prog[c.key]))
        .sort((a, b) => (prog[b.key].lapses || 0) - (prog[a.key].lapses || 0)).slice(0, len));
    } else if (kind === "free") {
      q = interleave(shuffle(pool.slice()).slice(0, len));
    } else {
      q = interleave(baueRunde());
    }

    setQueue(q); setPlan(q.length); setAt(0); setShown(false); setPicked(null); setRetry({}); setPeek(null); setTally({ ok: 0, n: 0 });
  };

  const grade = g => {
    const c = queue[at];
    const p = prog[c.key] || {};
    let box = p.box || 1, due, up = p.up;
    // Ein Fach weiter nur, wenn die Karte wirklich fällig war und heute noch nicht bewegt wurde.
    // Alles andere ist Übung: wertvoll, aber ohne Wirkung auf den Plan.
    const faellig = p.due === undefined || p.due <= t;
    if (g === 0) { box = 1; due = t; up = t; }                       // zurück und heute nochmal
    else if (g === 1) { due = Math.max(p.due || t, t + 1); }         // Fach bleibt, morgen wieder
    else if (faellig && p.up !== t) { box = Math.min(MAXBOX, box + 1); due = t + IVL[box]; up = t; }

    // Patzer: höchstens einer pro Tag und Karte — dieselbe Regel wie beim Fach.
    // Sonst zählte jede Wiederholung innerhalb einer Runde mit, und eine einzige
    // schlechte Begegnung ergäbe schon drei Patzer.
    // Die Stufe bewegt sich höchstens einmal pro Tag, in beide Richtungen: hoch nur bei
    // einem fälligen "Sass" (p.up !== t), runter nur beim ersten Patzer des Tages
    // (p.lapsed !== t). Sonst senkten die Wiederholungen innerhalb einer Runde die
    // Stufe gleich um drei.
    let grad = gradVon(p);
    if (g === 0) { if (p.lapsed !== t) grad = Math.max(1, grad - 1); }
    else if (faellig && p.up !== t) grad = Math.min(MAXSTUFE, grad + 1);
    let lapses = p.lapses || 0, lapsed = p.lapsed;
    if (g === 0 && p.lapsed !== t) { lapses++; lapsed = t; }
    // Fach 4 heisst: dreimal fehlerfrei an den Fälligkeitstagen. Der Rückstand ist
    // abgearbeitet, der Zähler wird gelöscht — sonst klebte „wackelig“ lebenslang.
    if (box >= WACKEL_FREI) { lapses = 0; lapsed = undefined; }
    const np = Object.assign({}, prog, { [c.key]: {
      box, due, up, st: grad, last: t, ts: Date.now(), seen: (p.seen || 0) + 1, lapses, lapsed } });
    setProg(np); persist(np, decks, coreOnly);
    setTally(v => ({ ok: v.ok + (g === 2 ? 1 : 0), n: v.n + 1 }));
    let q = queue;
    const tries = retry[c.key] || 0;
    const r = RETRY[g];
    if (r && tries < r.max && q.length < len + 12) {

      q.splice(Math.min(q.length, at + r.gap), 0, c);      // nicht ans Ende, sondern ein paar Karten später
      setRetry(Object.assign({}, retry, { [c.key]: tries + 1 }));
    }

    if (at + 1 >= q.length) setAt(q.length); else setAt(at + 1);

  };

        h("p", { className: "rule" }, h("b", null, "Kurz und oft. "), "Sieben Karten am Tag bringen mehr als eine Stunde am Sonntag. Der Abstand zwischen zwei Begegnungen ist das, was hängen bleiben lässt."),
        h("p", { className: "rule" }, h("b", null, "Abrufen statt nachlesen. "), "Erst selbst antworten, dann aufdecken. Das Suchen macht die Arbeit, nicht das Lesen."),

        h("p", { className: "rule" }, h("b", null, "Nicht gesessen heisst gleich nochmal. "), "„Nochmal“ legt die Karte dreimal wieder vor, „Mit Mühe“ einmal — beides noch in derselben Runde, mit ein paar Karten Abstand dazwischen."),

        h("p", { className: "rule" }, h("b", null, "Umschreiben läuft rückwärts los. "),

        h("ol", { className: "stufen" }, STUFEN_UMQ.map(([t, d], k) =>
          h("li", { key: t }, h("b", null, t + ". "), d))),
        h("p", { className: "rule" }, "Welche der drei Umschreibungen die richtige ist, wechselt von Begegnung zu Begegnung — du lernst also nicht einen Satz auswendig. Nach dem Aufdecken steht da, zu welchem Bedürfnis die anderen Fragen gehört hätten."),

        h("p", { className: "rule" }, h("b", null, "Reihenfolge. "), "Woche 1 bis 2 nur Gefühle und Bedürfnisse im Kernwortschatz. Umschreiben und «Was trennt sie?» erst, wenn die Wörter sitzen."))),
