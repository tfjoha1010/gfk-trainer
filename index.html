        h("div", { className: "wchips" }, grp.items.slice(0, 10).map(x => peekChip(x.w, peek, setPeek))),
        peek ? peekPanel(peek) : null),
      shown && h("button", { className: "btn", onClick: () => grade(picked === right ? 2 : 0) }, "Weiter"));
  } else if (c.kind === "toepfe") {
    label = "Welche Töpfe?";
    prompt = c.ber;
    const gs = MG[c.mode].filter(x => x.bereich === c.ber);
    body = !shown
      ? h("div", null,
          h("p", { className: "hint" }, "Welche " + gs.length + " Gruppen gehören in diesen Bereich?"),
          h("button", { className: "btn big", onClick: () => setShown(true) }, "Antwort zeigen"))
      : h("div", null,
          h("div", { className: "reveal" }, gs.map(x => h("p", { className: "d", key: x.id },
            h("b", null, x.name), " — ", x.sub))),
          gradeRow(grade));
  } else if (c.kind === "woerter") {
    label = "Welche Wörter?";
    prompt = grp.name;
    const kern = grp.items.filter(i => i.core), rest = grp.items.filter(i => !i.core);
    body = !shown
      ? h("div", null,
          h("p", { className: "hint" }, grp.sub + " — nenne " + (coreOnly && kern.length ? kern.length + " Kernwörter" : grp.items.length + " Wörter") + "."),
          h("button", { className: "btn big", onClick: () => setShown(true) }, "Antwort zeigen"))
      : h("div", null,
          h("div", { className: "reveal" },
            kern.length ? h("p", { className: "rowlab" }, "Kernwortschatz") : null,
            kern.length ? h("div", { className: "wchips" }, kern.map(x => peekChip(x.w, peek, setPeek))) : null,
            rest.length ? h("p", { className: "rowlab" }, kern.length ? "Dazu" : "Wörter") : null,
            rest.length ? h("div", { className: "wchips" }, rest.map(x => peekChip(x.w, peek, setPeek))) : null,
            peek ? peekPanel(peek) : null),
          gradeRow(grade));
  } else if (c.kind === "wort" && recog) {
    label = st === 3 ? "Welches der zwei?" : st === 2 ? "Welches Wort? (naher Topf)" : "Welches Wort?";
    prompt = item.d;
    body = h("div", null,
      h("div", { className: "opts" }, opts.map(o => h("button", {
        key: o, disabled: shown,
        className: "opt" + (shown ? (o === c.w ? " right" : (o === picked ? " wrong" : "")) : ""),
        onClick: () => answer(o)
      }, o))),
      shown && h("div", { className: "reveal" },
        h("p", { className: "rowlab" }, "Nachschlagen"),
        h("div", { className: "wchips" }, opts.map(o => peekChip(o, peek, setPeek))),
        peek ? peekPanel(peek) : h("p", { className: "def" }, "Auf ein Wort tippen zeigt seine Bedeutung — auch die der falschen Antworten.")),
      shown && h("button", { className: "btn", onClick: () => grade(picked === c.w ? 2 : 0) }, "Weiter"));
  } else if (c.kind === "wort" && st === 5) {
    // Umgekehrt: das Wort steht da, die Bedeutung musst du selbst sagen.
    label = "Was heisst es?";
    prompt = c.w;
    body = !shown
      ? h("div", null,
          h("p", { className: "hint" }, "Sag die Bedeutung laut, mit eigenen Worten. Dann vergleichen."),
          h("button", { className: "btn big", onClick: () => setShown(true) }, "Antwort zeigen"))
      : h("div", null,
          h("div", { className: "reveal" },
            h("p", { className: "d" }, item.d),
            h("p", { className: "def" }, grp.name, " — ", grp.sub),
            peek ? peekPanel(peek) : null),
          gradeRow(grade));
  } else if (c.kind === "wort" && st === 6) {
    // Oberste Stufe: die Abgrenzung selbst produzieren.
    const sw = SCHWELLEN_BY_W[c.w] || [];
    label = "Wovon grenzt es sich ab?";
    prompt = c.w;
    body = !shown
      ? h("div", null,
          h("p", { className: "hint" }, item.vs || sw.length
            ? "Nenne ein Nachbarwort — und woran du die beiden auseinanderhältst."
            : "Sag die Bedeutung laut und wogegen du dieses Wort abgrenzen würdest."),
          h("button", { className: "btn big", onClick: () => setShown(true) }, "Antwort zeigen"))
      : h("div", null,
          h("div", { className: "reveal" },
            item.vs
              ? h("div", null,
                  h("p", { className: "rowlab" }, "Abgrenzen von"),
                  h("div", { className: "wchips" }, item.vs.map(v => peekChip(v, peek, setPeek))))
              : h("p", { className: "def" }, "Für dieses Wort ist kein Nachbarwort eingetragen — hier zählt die Bedeutung."),
            sw.length
              ? h("div", null, h("p", { className: "rowlab" }, "Woran du es unterscheidest"),
                  sw.map(x => h("p", { className: "sq", key: x.q }, x.q, " ",
                    h("span", { className: "muted" }, x.a === c.w ? x.ha : x.hb))))
              : null,
            h("p", { className: "d" }, item.d),
            peek ? peekPanel(peek) : null),
          gradeRow(grade));
  } else if (c.kind === "wort") {
    label = "Welches " + noun + " ist das?";
    prompt = item.d;
    body = !shown
      ? h("button", { className: "btn big", onClick: () => setShown(true) }, "Antwort zeigen")
      : h("div", null,
          h("div", { className: "reveal" },
            h("div", { className: "answ" }, c.w),
            h("p", { className: "def" }, grp.name, " — ", grp.sub),
            item.vs ? h("p", { className: "rowlab" }, "Abgrenzen von") : null,
            item.vs ? h("div", { className: "wchips" }, item.vs.map(v => peekChip(v, peek, setPeek))) : null,
            peek ? peekPanel(peek) : null),
          gradeRow(grade));
  } else if (c.kind === "um" && st <= 3) {
    label = st === 3 ? "Welches der zwei?" : st === 2 ? "Welches Bedürfnis? (naher Topf)" : "Wonach wird gefragt?";
    prompt = umFragen.map(x => "„" + x + "“").join("\n");
    body = h("div", null,
      h("div", { className: "opts" }, opts.map(o => h("button", {
        key: o, disabled: shown,
        className: "opt" + (shown ? (o === c.w ? " right" : (o === picked ? " wrong" : "")) : ""),
        onClick: () => answer(o)
      }, o))),
      shown && h("div", { className: "reveal" },
        h("ul", { className: "qs" }, (U[c.w] || []).map(x => h("li", { key: x }, x))),
        h("p", { className: "rowlab" }, "Nachschlagen"),
        h("div", { className: "wchips" }, opts.map(o => peekChip(o, peek, setPeek))),
        peek ? peekPanel(peek) : null),
      shown && h("button", { className: "btn", onClick: () => grade(picked === c.w ? 2 : 0) }, "Weiter"));
  } else if (c.kind === "um" && st === 4) {
    label = "Wonach wird gefragt?";
    prompt = umFragen.map(x => "„" + x + "“").join("\n");
    body = !shown
      ? h("div", null,
          h("p", { className: "hint" }, "Welches Bedürfnis wird hier umschrieben? Selbst nennen."),
          h("button", { className: "btn big", onClick: () => setShown(true) }, "Antwort zeigen"))
      : h("div", null,
          h("div", { className: "reveal" },
            h("div", { className: "answ" }, c.w),
            h("p", { className: "def" }, item.d),
            h("ul", { className: "qs" }, (U[c.w] || []).map(x => h("li", { key: x }, x))),
            peek ? peekPanel(peek) : null),
          gradeRow(grade));
  } else if (c.kind === "um") {
    label = "Selbst umschreiben";
    prompt = c.w;
    body = !shown
      ? h("div", null,
          h("p", { className: "hint" }, "Formuliere zwei Fragen, mit denen du danach fragst, ohne das Wort zu benutzen."),
          h("button", { className: "btn big", onClick: () => setShown(true) }, "Antwort zeigen"))
      : h("div", null,
          h("div", { className: "reveal" },
            h("ul", { className: "qs" }, (U[c.w] || []).map(x => h("li", { key: x }, x))),
            h("p", { className: "def" }, item.d),
            item.vs ? h("p", { className: "rowlab" }, "Abgrenzen von") : null,
            item.vs ? h("div", { className: "wchips" }, item.vs.map(v => peekChip(v, peek, setPeek))) : null,
            peek ? peekPanel(peek) : null),
          gradeRow(grade));
  } else if (c.kind === "umq") {
    const richtig = frageVon(c.w, p.seen);
    // Auf der obersten Stufe stammen beide Ablenker vom selben Partner — dann soll
    // sein Name einmal dastehen, nicht zweimal.
    const andere = Array.from(new Set(opts.filter(o => o !== richtig).map(o => Q_OWNER[o]).filter(Boolean)));
    label = "Welche Frage passt?";
    prompt = c.w;
    body = h("div", null,
      h("p", { className: "hint" }, "Welche dieser Fragen fragt nach diesem Bedürfnis, ohne es zu nennen?"),
      h("div", { className: "opts fragen" }, opts.map(o => h("button", {
        key: o, disabled: shown,
        className: "opt q" + (shown ? (o === richtig ? " right" : (o === picked ? " wrong" : "")) : ""),
        onClick: () => answer(o)
      }, "„" + o + "“"))),
      shown && h("div", { className: "reveal" },
        h("p", { className: "def" }, item.d),
        h("p", { className: "rowlab" }, "Alle drei Umschreibungen"),
        h("ul", { className: "qs" }, (U[c.w] || []).map(x => h("li", { key: x }, x))),
        andere.length ? h("p", { className: "rowlab" }, andere.length > 1 ? "Die anderen Fragen gehörten zu" : "Die andere Frage gehörte zu") : null,
        andere.length ? h("div", { className: "wchips" }, andere.map(w => peekChip(w, peek, setPeek))) : null,
        peek ? peekPanel(peek) : null),
      shown && h("button", { className: "btn", onClick: () => grade(picked === richtig ? 2 : 0) }, "Weiter"));
  } else if (c.kind === "schwelle") {
    label = c.sw.art ? "Was trennt sie? (Art)" : "Was trennt sie? (Stärke)";
    prompt = c.sw.a + "  oder  " + c.sw.b + "?";
    body = !shown
      ? h("div", null,
          h("p", { className: "hint" }, "Welche Frage würdest du dir stellen, um die beiden zu trennen?"),
          h("button", { className: "btn big", onClick: () => setShown(true) }, "Antwort zeigen"))
      : h("div", null,
          h("div", { className: "reveal" },
            h("p", { className: "sq" }, c.sw.q),
            h("p", { className: "sa" },
              h("b", null, c.sw.ha), " → ", peekChip(c.sw.a, peek, setPeek),
              h("span", { className: "slash" }, "·"),
              h("b", null, c.sw.hb), " → ", peekChip(c.sw.b, peek, setPeek)),
            peek && ITEM[peek] ? peekPanel(peek) : null),
          gradeRow(grade));
  } else {
    const sit = SITUATIONS[c.idx];
    label = "Situation";
    prompt = sit.s;
    body = !shown
      ? h("div", null,
          h("p", { className: "hint" }, "Ein Gefühl und ein Bedürfnis benennen. Erst dann aufdecken."),
          h("button", { className: "btn big", onClick: () => setShown(true) }, "Antwort zeigen"))
      : h("div", null,
          h("div", { className: "reveal" },
            h("p", { className: "rowlab" }, "Gefühle"),
            h("div", { className: "wchips" }, sit.f.map(w => peekChip(w, peek, setPeek))),
            h("p", { className: "rowlab" }, "Bedürfnisse"),
            h("div", { className: "wchips" }, sit.b.map(w => peekChip(w, peek, setPeek))),
            peek && peekPanel(peek),
            h("p", { className: "def" }, peek ? "Nochmals tippen schliesst die Erklärung."
              : "Auf ein Wort tippen zeigt seine Bedeutung. Deine Antwort zählt auch, wenn sie hier nicht steht und trotzdem passt.")),
          gradeRow(grade));
  }

  // Zähler: "neu" sind die geplanten Karten der Session, "Wdh." die zusätzlich
  // eingeschobenen Fehlerkarten. Der Nenner der ersten Zahl bewegt sich nie.
  const neu = Math.min(at, plan), tail = at >= plan;
  const offen = queue.length - at;
  return h("div", { className: "trainer", style: acc },
    h("div", { className: "prog" },
      h("div", { className: "pfill", style: { width: Math.round(neu / Math.max(1, plan) * 100) + "%" } }),
      tail && h("div", { className: "pfill tail", style: { width: "100%" } })),
    h("div", { className: "cardmeta" },
      tail
        ? h("span", null, h("b", null, plan), " von ", plan, " neu",
            h("i", { className: "extra" }, "jetzt " + offen + " Wdh."))
        : h("span", null, "Karte ", h("b", null, neu + 1), " von ", plan, " neu",
            queue.length > plan ? h("i", { className: "extra" }, "danach " + (queue.length - plan) + " Wdh.") : null),
      h("span", { className: "kind" }, label),
      h("span", null, "Fach " + box + (c.kind === "wort" || c.kind === "um" || c.kind === "umq" ? " · Stufe " + st : "")
        + (istWackelig(p) ? " · wackelig" : "") + (c.early && !c.shaky ? " · vorgezogen" : "")),
      mehrere ? h("span", { className: "who" }, profile.name) : null),
    h("div", { className: "card" },
      h("p", { className: "promptx" }, prompt),
      body),
    h("button", { className: "linkish resetlink", onClick: () => { setQueue(null); setAt(0); } }, "Session abbrechen")
  );
}

// Verwaltet, wer gerade lernt. Der Trainer selbst kennt nur ein Profil und wird beim
// Wechsel neu aufgebaut (key), damit keine halbe Session der einen Person bei der
// anderen weiterläuft.
function TrainerRoot() {
  const [store, setStore] = useState(() => migrate(readLocal()) || freshStore());
  const [gen, setGen] = useState(0);          // erzwingt Neuaufbau nach Fernabgleich
  const [synced, setSynced] = useState(false);
  const [open, setOpen] = useState(false);
  const [adding, setAdding] = useState(null);  // null = Feld zu, sonst der getippte Name
  const [ren, setRen] = useState(null);        // { id, value }
  const [kill, setKill] = useState(null);      // id, zweistufig
  const [xfer, setXfer] = useState(null);      // { ok, text }: Rückmeldung nach Sichern oder Laden
  const ref = useRef(store);
  ref.current = store;

  useEffect(() => {
    let live = true;
    // Den umgestellten Stand sofort festschreiben, wenn das Gespeicherte noch die alte
    // Form hat oder gar nichts da war. Sonst bekäme das Profil bei jedem Laden eine neue
    // Kennung, und ein Abgleich würde dieselbe Historie auf zwei Profile verdoppeln.
    const raw = readLocal();
    if (!raw || raw.v !== 2 || !raw.profiles) writeLocal(ref.current);
    pullRemote().then(r => {
      if (!live) return;
      setSynced(!!dbRef);
      const rem = migrate(r);
      if (!rem) return;
      const s = ref.current, m = mergeStores(s, rem);
      const moved = m.current !== s.current || m.profiles[m.current] !== s.profiles[s.current];
      setStore(m); writeLocal(m); pushRemote(m);
      if (moved) setGen(g => g + 1);
    });
    return () => { live = false; };
  }, []);

  useEffect(() => { if (kill === null) return;
    const id = setTimeout(() => setKill(null), 8000); return () => clearTimeout(id); }, [kill]);

  const write = next => { next.updated = Date.now(); setStore(next); writeLocal(next); pushRemote(next); };
  const cur = store.current, prof = store.profiles[cur];
  const ids = Object.keys(store.profiles)
    .sort((a, b) => store.profiles[a].created - store.profiles[b].created);
  const mehrere = ids.length > 1;

  const save = patch => {
    const p = Object.assign({}, ref.current.profiles[ref.current.current], patch, { updated: Date.now() });
    write(Object.assign({}, ref.current, {
      profiles: Object.assign({}, ref.current.profiles, { [ref.current.current]: p }) }));
    setXfer(null);   // sobald weitergelernt wird, ist die Meldung überholt
  };
  const goto = id => { setOpen(false); setKill(null); setRen(null); setXfer(null);
    if (id !== cur) { write(Object.assign({}, store, { current: id })); setGen(g => g + 1); } };
  const add = () => {
    const name = cleanName(adding, "");
    if (!name) return;
    const id = newId();
    write(Object.assign({}, store, { current: id,
      profiles: Object.assign({}, store.profiles, { [id]: blankProfile(name) }) }));
    setAdding(null); setOpen(false); setGen(g => g + 1);
  };
  const doRen = () => {
    if (!ren) return;
    const name = cleanName(ren.value, "");
    if (name) {
      const p = Object.assign({}, store.profiles[ren.id], { name, updated: Date.now() });
      write(Object.assign({}, store, { profiles: Object.assign({}, store.profiles, { [ren.id]: p }) }));
    }
    setRen(null);
  };
  const drop = id => {
    const profiles = Object.assign({}, store.profiles); delete profiles[id];
    const deleted = Object.assign({}, store.deleted || {}, { [id]: Date.now() });
    const rest = Object.keys(profiles);
    const next = rest.length
      ? { v: 2, profiles, deleted, current: id === cur ? rest[0] : cur }
      : Object.assign(freshStore(), { deleted });
    write(next); setKill(null); setOpen(false);
    if (id === cur) setGen(g => g + 1);
  };

  const anz = p => Object.keys(p.cards || {}).length;
  const zuUebertragen = () => {
    const el = document.getElementById("xfer");
    if (!el) return;
    el.open = true;
    el.scrollIntoView({ behavior: reduced() ? "auto" : "smooth", block: "start" });
  };
  // Wo der Lernstand liegt: im Trainer nur eine Zeile, der ganze Text auf Wunsch
  // und beim Anlegen einer Person.
  const [mehrInfo, setMehrInfo] = useState(false);
  const infoText = [
    h("p", { key: "a" }, h("b", null, "Dein Lernstand bleibt nur in diesem Browser. "),
      "Es gibt kein Konto und keinen Server, und niemand sonst sieht deinen Fortschritt. Lern deshalb immer im selben "
      + "Browser und nicht im privaten Fenster. Wer die Browserdaten löscht, löscht auch den Lernstand."),
    h("p", { key: "b" }, h("b", null, "Gerät wechseln oder sichern: "),
      "Unter «Lernstand übertragen» speicherst du deinen Stand als Datei und lädst ihn auf dem anderen Gerät wieder. ",
      h("button", { className: "linkish", onClick: zuUebertragen }, "So geht’s")),
    h("p", { key: "c", className: "note tiny" }, "iPhone: Die Seite über «Teilen → Zum Home-Bildschirm» hinzufügen und von dort "
      + "öffnen. Sonst löscht Safari den Lernstand nach etwa einer Woche ohne Besuch.")];
  const lagerinfo = synced
    ? h("p", { className: "note tiny lagerzeile" }, "Dein Lernstand wird mit deinem Claude-Konto gespeichert.")
    : h("div", { className: "lagerzeile" },
        h("p", { className: "note tiny" }, "Dein Lernstand bleibt nur in diesem Browser. ",
          h("button", { className: "linkish tiny", "aria-expanded": mehrInfo, onClick: () => setMehrInfo(!mehrInfo) },
            mehrInfo ? "Weniger" : "Mehr dazu")),
        mehrInfo && h("div", { className: "lagerinfo", role: "note" }, infoText));
  const bar = h("div", { className: "who-bar" },
    h("button", { className: "who-now", "aria-expanded": open, onClick: () => { setOpen(!open); setKill(null); setRen(null); } },
      h("span", { className: "who-lab" }, "Lernende"),
      h("span", { className: "who-name" }, prof.name),
      h("span", { className: "who-arrow" }, open ? "▴" : "▾")),
    open && h("div", { className: "who-list" },
      ids.map(id => {
        const p = store.profiles[id];
        return h("div", { className: "who-row" + (id === cur ? " on" : ""), key: id },
          ren && ren.id === id
            ? h("div", { className: "who-edit" },
                h("input", { className: "who-input", value: ren.value, maxLength: 24, autoFocus: true,
                  onChange: e => setRen({ id, value: e.target.value }),
                  onKeyDown: e => { if (e.key === "Enter") doRen(); if (e.key === "Escape") setRen(null); },
                  "aria-label": "Name ändern" }),
                h("button", { className: "btn tiny", onClick: doRen }, "Speichern"),
                h("button", { className: "btn tiny ghost", onClick: () => setRen(null) }, "Abbrechen"))
            : h(React.Fragment, null,
                h("button", { className: "who-pick", onClick: () => goto(id) },
                  h("b", null, p.name),
                  h("span", null, anz(p) === 0 ? "noch nichts angefangen"
                    : anz(p) + (anz(p) === 1 ? " Karte" : " Karten") + " angefangen")),
                h("button", { className: "linkish tiny", onClick: () => setRen({ id, value: p.name }) }, "Umbenennen"),
                kill === id
                  ? h("button", { className: "btn tiny danger", onClick: () => drop(id) },
                      "Wirklich löschen?")
                  : h("button", { className: "linkish tiny warn", onClick: () => setKill(id) }, "Löschen")));
      }),
      adding === null
        ? h("button", { className: "btn tiny ghost addp", onClick: () => setAdding("") }, "+ Person hinzufügen")
        : h(React.Fragment, null, h("div", { className: "who-edit" },
            h("input", { className: "who-input", value: adding, maxLength: 24, autoFocus: true,
              placeholder: "Name", onChange: e => setAdding(e.target.value),
              onKeyDown: e => { if (e.key === "Enter") add(); if (e.key === "Escape") setAdding(null); },
              "aria-label": "Name der neuen Person" }),
            h("button", { className: "btn tiny", onClick: add }, "Anlegen"),
            h("button", { className: "btn tiny ghost", onClick: () => setAdding(null) }, "Abbrechen")),
            !synced && h("div", { className: "lagerinfo neu", role: "note" }, infoText)),
      h("p", { className: "note tiny" },
        "Jede Person hat ihren eigenen Fortschritt und ihre eigenen Einstellungen."
        + (synced ? "" : " Alles bleibt in diesem Browser."))), !open && lagerinfo);

  // ---------- Lernstand sichern und laden ----------
  const lernstand = () => {
    const s = ref.current, id = s.current, p = s.profiles[id];
    const d = new Date(), z = n => String(n).padStart(2, "0");
    const datum = d.getFullYear() + "-" + z(d.getMonth() + 1) + "-" + z(d.getDate());
    const wer = p.name.toLocaleLowerCase("de").replace(/ä/g, "ae").replace(/ö/g, "oe").replace(/ü/g, "ue")
      .replace(/ß/g, "ss").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
    const json = JSON.stringify({ app: XFER_APP, art: "Lernstand", v: 2, gesichert: d.toISOString(),
      store: { v: 2, current: id, updated: s.updated || 0, deleted: {}, profiles: { [id]: p } } });
    return { json, name: "gfk-lernstand-" + (wer ? wer + "-" : "") + datum, person: p.name };
  };
  const sichern = () => {
    const { json, name } = lernstand();
    try {
      const url = URL.createObjectURL(new Blob([json], { type: "application/json" }));
      const a = document.createElement("a");
      a.href = url; a.download = name + ".json";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 10000);
      setXfer({ ok: true, text: "Gespeichert als «" + name + ".json», meist im Ordner «Downloads». "
        + "Bring die Datei aufs andere Gerät, etwa per Mail an dich selbst, und wähle dort hier «Lernstand laden»." });
    } catch (e) {
      setXfer({ ok: false, text: "Speichern hat nicht geklappt. Versuch es in einem anderen Browser." });
    }
  };
  const teilen = async () => {
    const { json, name } = lernstand();
    const file = TEILEN === "json"
      ? new File([json], name + ".json", { type: "application/json" })
      : new File([json], name + ".txt", { type: "text/plain" });
    try {
      await navigator.share({ files: [file] });
      setXfer({ ok: true, text: "Geteilt. Auf dem anderen Gerät die Datei speichern und hier mit «Lernstand laden» öffnen." });
    } catch (e) {
      if (e && e.name === "AbortError") return;
      setXfer({ ok: false, text: "Teilen hat nicht geklappt. Nimm stattdessen «Lernstand sichern»." });
    }
  };
  const laden = e => {
    const f = e.target.files && e.target.files[0];
    e.target.value = "";   // dieselbe Datei soll sich nochmal wählen lassen
    if (!f) return;
    const fail = () => setXfer({ ok: false, text: "Diese Datei kann ich nicht lesen. Wähle eine Datei "
      + "«gfk-lernstand-….json», die du mit «Lernstand sichern» erstellt hast." });
    if (f.size > 5e6) return fail();
    const rd = new FileReader();
    rd.onerror = fail;
    rd.onload = () => {
      let data;
      try { data = JSON.parse(rd.result); } catch (x) { return fail(); }
      const inc = leseLernstand(data);
      if (!inc) return fail();
      const r = importStore(ref.current, inc);
      if (!r) { setXfer({ ok: true, text: "In der Datei war nichts, was hier noch fehlt." }); return; }
      write(r.store); setOpen(false); setKill(null); setRen(null); setGen(g => g + 1);
      setXfer({ ok: true, text: berichte(r.report) });
    };
    rd.readAsText(f);
  };

  const transfer = h(React.Fragment, null,
    h("details", { className: "klapp", id: "xfer" },
      h("summary", null, "Lernstand übertragen"),
      h("p", { className: "note" }, "Dein Fortschritt liegt nur in diesem Browser. So nimmst du ihn auf ein anderes Gerät mit:"),
      h("ol", { className: "stufen" },
        h("li", null, "Hier ", h("b", null, "Lernstand sichern"), " wählen. Es entsteht eine kleine Datei «gfk-lernstand-….json», "
          + "meist im Ordner «Downloads». Auf dem Handy geht es auch direkt über «Teilen …»."),
        h("li", null, "Die Datei aufs andere Gerät bringen, etwa per Mail an dich selbst."),
        h("li", null, "Dort diese Seite öffnen, unter «Trainer» → «Lernstand übertragen» auf ", h("b", null, "Lernstand laden"),
          " tippen und die Datei wählen.")),
      h("p", { className: "note" }, "Das geht beliebig oft und in beide Richtungen. Die Karten werden einzeln zusammengeführt, "
        + "und der zuletzt geübte Stand gewinnt. Es geht nichts verloren, auch wenn du zwischendurch auf beiden Geräten gelernt hast."),
      h("div", { className: "tools" },
        h("button", { className: "tool", onClick: sichern }, "Lernstand sichern"),
        TEILEN && h("button", { className: "tool", onClick: teilen }, "Teilen …"),
        h("label", { className: "tool file" }, "Lernstand laden",
          h("input", { type: "file", onChange: laden, "aria-label": "Lernstand laden" }))),
      h("p", { className: "note tiny" }, "Gesichert wird der Stand von «" + prof.name + "»"
        + (mehrere ? ". Für eine andere Person zuerst oben unter «Lernende» wechseln." : ".")
        + " Die Datei taugt auch als Backup, etwa bevor du Browserdaten löschst.")),
    xfer && h("p", { className: "xfer-msg" + (xfer.ok ? "" : " bad"), role: "status" }, xfer.text));

  return h(Trainer, { key: cur + "#" + gen, profile: prof, save, bar, transfer, synced, mehrere });
}

// Gefühl und Bedürfnis sind je nach Tab ein Wort oder mehrere
const liste = v => [].concat(v === undefined || v === null ? [] : v).filter(Boolean);

function peekChip(w, peek, setPeek) {
  return h("button", { key: w, className: "wchip" + (peek === w ? " on" : ""),
    "aria-expanded": peek === w,
    onClick: () => setPeek(peek === w ? null : w) }, w);
}

function peekPanel(w) {
  const i = ITEM[w], g = ITEM_GROUP[w];
  return h("div", { className: "peek" },
    h("div", { className: "peekhead" }, h("b", null, w),
      g ? h("span", null, g.name + " — " + g.sub) : null),
    h("p", { className: "d" }, i.d),
    i.vs ? h("p", { className: "def" }, "Abgrenzen von ", h("b", null, i.vs.join(", ")), ".") : null,
    g && g.bereich ? h("p", { className: "def" }, "Bereich: " + g.bereich) : null,
    i.opp ? h("p", { className: "def" }, "Gegenstück: " + i.opp.join(", ")) : null,
    U[w] ? h("p", { className: "def" }, "Umschreiben: „" + U[w][0] + "“") : null);
}

function gradeRow(grade) {
  return h("div", { className: "grades" },
    h("button", { className: "grade g0", onClick: () => grade(0) }, "Nochmal"),
    h("button", { className: "grade g1", onClick: () => grade(1) }, "Mit Mühe"),
    h("button", { className: "grade g2", onClick: () => grade(2) }, "Sass"));
}

function App() {
  const [mode, setMode] = useState("neg");
  const [q, setQ] = useState("");
  const [active, setActive] = useState(null);
  const [pending, setPending] = useState(null);
  const [practice, setPractice] = useState(false);
  const [revealed, setRevealed] = useState({});
  const [peek, setPeek] = useState(null);
  const M = MODES[mode];
  const isU = !!M.questions;

  const query = q.trim().toLowerCase();
  const qOf = i => (i.w && U[i.w]) || [];
  // Einträge haben je nach Tab die Form {w,d}, {q,a,f,b} oder {s,v,f,b}
  const hay = i => [i.w, i.d, i.q, i.a, i.s, i.v, i.f, i.b, i.e, i.t, i.nah, i.hw].concat(qOf(i)).filter(Boolean).join(" ").toLowerCase();
  const matches = i => hay(i).includes(query);
  const groups = useMemo(() => M.groups.map(g => ({ ...g, shown: query ? g.items.filter(matches) : g.items }))
    .filter(g => g.shown.length), [query, mode]);
  const total = groups.reduce((s, g) => s + g.shown.length, 0);
  const others = useMemo(() => {
    if (!query) return [];
    return Object.entries(MODES).filter(([k]) => k !== mode)
      .map(([k, v]) => [k, v.groups.reduce((s, g) => s + g.items.filter(matches).length, 0)])
      .filter(([, n]) => n > 0);
  }, [query, mode]);

  useEffect(() => {
    if (!pending) return;
    const el = document.getElementById(pending);
    if (el) el.scrollIntoView({ behavior: reduced() ? "auto" : "smooth", block: pending.startsWith("f-") ? "center" : "start" });
    setPending(null);
  }, [pending, groups]);

  const jump = w => {
    const m = WORD_MODE[w];
    if (m && m !== mode && !(isU && m === "needs")) setMode(m);
    if (query) setQ("");
    const gid = WORD_GROUP[w];
    if (gid) setRevealed(r => r[gid] ? r : { ...r, [gid]: true });
    setActive(w); setPending(slug(w));
  };
  const switchMode = m => { setMode(m); setActive(null); setRevealed({}); setPeek(null); window.scrollTo({ top: 0, behavior: reduced() ? "auto" : "smooth" }); };
  const toId = id => { const el = document.getElementById(id); if (el) el.scrollIntoView({ behavior: reduced() ? "auto" : "smooth", block: "start" }); };
  const style = g => ({ "--accent": g.accent, "--accent-d": g.accentD });
  const link = w => h("button", { key: w, className: "linkish", onClick: e => { e.stopPropagation(); jump(w); } }, w);
  const joinLinks = ws => ws.flatMap((w, k) => k ? [", ", link(w)] : [link(w)]);
  const bId = b => "b-" + mode + "-" + (BER[mode] || []).indexOf(b);
  const chipFor = (g, i) => {
    const p = g.ladder ? Math.round(12 + i.t * 83) : 0;
    const cls = "chip" + (g.ladder ? (i.t > 0.5 ? " strong" : "") : " plain") + (active === i.w ? " on" : "");
    return h("button", { key: i.w, className: cls, style: { "--p": p + "%" }, onClick: () => jump(i.w) }, i.w);
  };

  let lastBereich = null;
  const seg = h("div", { className: "seg", role: "group", "aria-label": "Liste wählen" },
    Object.entries(MODES).map(([k, v]) => h("button", { key: k, "aria-pressed": mode === k, onClick: () => switchMode(k),
      className: v.trainer ? "seg-train" : undefined },
      v.trainer ? h(React.Fragment, null, h("span", { className: "seg-ico", "aria-hidden": "true" }, "▶"), " " + v.tab) : v.tab)));

  if (M.en) {
    // Rosenbergs Originallisten. Zwei Fälle pro Eintrag: entweder es gibt das Wort
    // hier schon (w → anklickbare Chips), oder es gibt es nicht (t + d + nah).
    const gs = M.groups.map(g => ({ ...g, shown: query ? g.items.filter(matches) : g.items }))
      .filter(g => g.shown.length);
    const n = gs.reduce((a, g) => a + g.shown.length, 0);
    const alle = M.groups.flatMap(g => g.items);
    const ergaenzt = alle.filter(i => i.neu).length;
    return h("div", { className: "wrap" },
      h("h1", null, M.title),
      h("p", { className: "lead" }, M.lead),
      h("div", { className: "bar" }, seg,
        h("input", { className: "search", type: "search", placeholder: M.ph, value: q,
          onChange: e => setQ(e.target.value), "aria-label": "Suchen" }),
        h("nav", { className: "nav", "aria-label": "Abschnitte" },
          gs.map(g => h("button", { key: g.id, style: style(g), className: "group-dot", onClick: () => toId("g-" + g.id) },
            h("span", { className: "dot" }), g.name)))),


      query && h("p", { className: "note", style: { marginTop: 14 } },
        n + " " + (n === 1 ? M.unit[0] : M.unit[1]) + " gefunden"),

      n === 0 && h("div", { className: "empty" },
        h("p", null, "Nichts passt zu „" + q + "“."),
        h("button", { className: "btn", onClick: () => setQ("") }, "Suche leeren")),

      gs.map(g => h("section", { key: g.id, id: "g-" + g.id, className: "group", style: style(g) },
        h("div", { className: "ghead" }, h("h3", null, g.name),
          g.sub ? h("span", { className: "sub" }, g.sub) : null),
        h("ul", { className: "list enlist" }, g.shown.map((i, k) => {
          const chips = i.w || [];
          return h("li", { key: g.id + "-" + k, className: "item en" },
            h("p", { className: "enword" }, i.e),
            h("p", { className: "annot" }, h("span", null, "deutsch: ", i.w.map(w => peekChip(w, peek, setPeek)))),
            i.hw ? h("p", { className: "warum" }, i.hw) : null,
            peek && ITEM[peek] && chips.indexOf(peek) >= 0 ? peekPanel(peek) : null);
        }))))
    );
  }

  if (M.trainer) return h("div", { className: "wrap" },
    h("h1", null, M.title),
    h("p", { className: "lead" }, M.lead),
    h("div", { className: "bar" }, seg),
    h(TrainerRoot, null));

  return h("div", { className: "wrap" },
    h("h1", null, M.title),
    h("p", { className: "lead" }, M.lead),

    h("div", { className: "bar" },
      seg,
      h("input", { className: "search", type: "search", placeholder: M.ph, value: q,
        onChange: e => setQ(e.target.value), "aria-label": "Suchen" }),
      h("div", { className: "tools" },
        h("button", { className: "tool" + (practice ? " on" : ""), "aria-pressed": practice,
          onClick: () => { setPractice(!practice); setActive(null); setRevealed({}); } },
          practice ? "Üben: an" : "Üben: aus"),
        h("button", { className: "tool", onClick: () => {
          const all = M.groups.flatMap(g => g.items);
          jump(all[Math.floor(Math.random() * all.length)].w);
        } }, "Zufälliges " + M.unit[0]),
        practice && !isU && Object.keys(revealed).length > 0 &&
          h("button", { className: "tool", onClick: () => { setRevealed({}); setActive(null); } }, "Wieder verdecken")),
      h("nav", { className: "nav", "aria-label": "Gruppen" },
        groups.map(g => h("button", { key: g.id, style: style(g), className: "group-dot", onClick: () => toId("g-" + g.id) },
          h("span", { className: "dot" }), g.name)))
    ),

    !query && !(practice && !isU) && M.keys.length > 0 && h("div", { className: "keys" },
      M.keys.map(k => h("section", { className: "key", key: k.title },
        h("h3", null, k.title),
        k.text && h("p", null, k.text),
        k.rules && k.rules.map(([b, t]) => h("p", { className: "rule", key: b }, h("b", null, b), t))
      ))
    ),

    query && h("p", { className: "note", style: { marginTop: 14 } },
      total + " " + (total === 1 ? M.unit[0] : M.unit[1]) + " gefunden",
      ...others.map(([k, n]) => h("span", { key: k }, ". In „" + MODES[k].tab + "“: " + n + " ",
        h("button", { className: "linkish", onClick: () => setMode(k) }, "anzeigen")))),

    groups.length === 0 && h("div", { className: "empty" },
      h("p", null, "Nichts in dieser Liste passt zu „" + q + "“. Versuche einen Wortteil oder wechsle die Liste oben."),
      h("button", { className: "btn", onClick: () => setQ("") }, "Suche leeren")),

    groups.map(g => {
      const core = g.items.filter(i => !i.extra);
      const extras = g.items.filter(i => i.extra);
      const showBereich = g.bereich && g.bereich !== lastBereich;
      lastBereich = g.bereich || lastBereich;
      const covered = practice && !query && !isU && !revealed[g.id];
      const n = g.items.length;
      return h(React.Fragment, { key: g.id },
        showBereich && h("h2", { className: "bereich", id: bId(g.bereich) }, g.bereich),
        h("section", { id: "g-" + g.id, className: "group" + (covered ? " covered" : ""), style: style(g) },
          covered
            ? h("button", { className: "ghead cover", "aria-expanded": false,
                onClick: () => setRevealed(r => ({ ...r, [g.id]: true })) },
                h("span", { className: "gname" }, g.name),
                h("span", { className: "sub" }, g.sub),
                h("span", { className: "count" }, n + " " + (n === 1 ? M.unit[0] : M.unit[1]) + " — tippen zum Aufdecken"))
            : h("div", { className: "ghead" }, h("h3", null, g.name), h("span", { className: "sub" }, g.sub)),

          !covered && !query && h("div", null,
            g.stages
              ? h("div", { className: "ramp" }, g.stages.flatMap(st => [
                  h("span", { key: "s-" + st, className: "sep" }, st + ":"),
                  ...core.filter(i => i.stage === st).map(i => chipFor(g, i))]))
              : h("div", { className: "ramp" },
                  core.map(i => chipFor(g, i)),
                  extras.length > 0 && h("span", { className: "sep" }, g.extraLabel || "Weitere:"),
                  extras.map(i => h("button", { key: i.w, className: "chip folge" + (active === i.w ? " on" : ""), onClick: () => jump(i.w) }, i.w))),
            g.ladder && h("div", { className: "axis", "aria-hidden": "true" }, h("span", null, "leicht"), h("span", { className: "line" }), h("span", null, "stark")),
            g.note && h("p", { className: "note" }, g.note),
            (SCHWELLEN_BY_G[g.id] || []).length > 0 && h("details", { className: "schwellen" },
              h("summary", null, "Wo stehe ich? ", h("span", { className: "cnt" }, (SCHWELLEN_BY_G[g.id] || []).length + " Fragen")),
              (SCHWELLEN_BY_G[g.id] || []).map(x => h("div", { className: "schwelle", key: x.a + "|" + x.b + "|" + x.q },
                h("p", { className: "sq" }, x.q, x.art ? h("span", { className: "arttag" }, "Art") : null),
                h("p", { className: "sa" },
                  h("b", null, x.ha), " → ", peekChip(x.a, peek, setPeek),
                  h("span", { className: "slash" }, "·"),
                  h("b", null, x.hb), " → ", peekChip(x.b, peek, setPeek)))),
              peek && ITEM[peek] ? peekPanel(peek) : null)
          ),

          !covered && h("ul", { className: "list" }, g.shown.map(i => {
            // Leitergruppen: die Farbe steigt mit der Stärke, wie bei den Chips oben.
            // Gruppen ohne Leiter: ein ruhiger Ton der Gruppenfarbe, damit jede Zeile
            // zeigt, wo sie hingehört. Was daneben steht, bleibt gestrichelt.
            const p = i.extra ? 0 : g.ladder ? Math.round(12 + (i.t || 0) * 83) : 34;
            const marke = i.extra ? "mark folge" : "mark";
            return h("li", { key: i.w, id: slug(i.w), className: "item" + (active === i.w ? " on" : ""),
              style: { "--p": p + "%" }, onClick: () => setActive(i.w) },
              h("div", { className: "w" },
                marke ? h("span", { className: marke, "aria-hidden": "true" }) : null,
                h("span", null, i.w),
                i.extra ? h("span", { className: "nebentag" }, g.extraLabel ? g.extraLabel.replace(":", "") : "Daneben") : null),
              isU
                ? (practice && active !== i.w
                    ? h("p", { className: "hint" }, "Tippen, um die Umschreibungen zu sehen")
                    : h("div", null,
                        h("ul", { className: "qs" }, qOf(i).map(t => h("li", { key: t }, t))),
                        h("p", { className: "def" }, i.d)))
                : h("p", { className: "d" }, i.d),
              i.vs && h("div", { className: "vs" }, "Abgrenzen von ", ...joinLinks(i.vs)),
              i.opp && h("div", { className: "vs" }, "Gegenstück: ", ...joinLinks(i.opp))
            );
          }))
        )
      );
    })
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
